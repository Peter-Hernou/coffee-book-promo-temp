<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coffee Book — Peter Hernou</title>
    <meta name="description" content="A page-turning Coffee Book: 170+ fully worked drinks by Peter Hernou, from the phmenu.studio recipe library." />
    <link rel="stylesheet" href="./css/book.css?v=127" />
  </head>
  <body class="reader">
    <header class="bar">
      <p class="bar__mark">phmenu.studio</p>
      <h1>Coffee Book</h1>
      <div class="bar__actions">
        <button type="button" class="bar__btn" id="soundBtn" aria-pressed="true">Sound on</button>
        <button type="button" class="bar__btn" id="contentsBtn">Contents</button>
      </div>
    </header>

    <main class="stage">
      <div class="desk" id="desk">
        <div class="desk-row">
          <button type="button" class="side side-prev" id="prevBtn" aria-label="Previous page"></button>
          <div class="book-zoom">
            <div class="book-stage">
              <div id="book"></div>
            </div>
          </div>
          <button type="button" class="side side-next" id="nextBtn" aria-label="Next page"></button>
        </div>
      </div>
    </main>

    <nav class="chrome" aria-label="Book">
      <button type="button" id="prev">Prev</button>
      <span id="pos">Cover</span>
      <button type="button" id="next">Next</button>
    </nav>
    <p class="hint">Drag a corner to turn</p>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>

    <div class="overlay" id="contentsOverlay" hidden>
      <div class="overlay__panel">
        <div class="overlay__head">
          <h2>Contents</h2>
          <button type="button" class="bar__btn bar__btn--dark" id="contentsClose">Close</button>
        </div>
        <label class="overlay__search">
          <span class="visually-hidden">Search recipes</span>
          <input id="contentsSearch" type="search" placeholder="Search a drink…" autocomplete="off" />
        </label>
        <div class="overlay__body" id="contentsBody"></div>
      </div>
    </div>

    <script src="./vendor/page-flip/page-flip.browser.js"></script>
    <script src="./js/book.js?v=127"></script>
  </body>
</html>
